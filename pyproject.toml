[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-diff-hooks"
version = "0.3.0"
description = "pre-commit hooks that enforce test coverage on new/modified lines only."
requires-python = ">=3.9"
dependencies = [
    "diff-cover>=9",
    "pyyaml>=6",
]

[project.scripts]
coverage-diff-install-skill = "coverage_diff_hooks.install_skill:main"
coverage-diff-php ="coverage_diff_hooks.php_hook:main"
coverage-diff-python ="coverage_diff_hooks.python_hook:main"

[tool.setuptools]
packages = ["coverage_diff_hooks"]

[tool.setuptools.package-data]
coverage_diff_hooks = ["skills/**/*.md"]
